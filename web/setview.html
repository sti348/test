<!doctype html><html><head><meta charset="utf-8"><title>set</title>
<style>html,body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"/web/node_modules/three/build/three.module.js"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import { Stage, aimCamera } from './lib/stage.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1280), H = +(q.get('h') || 720);
const st = new Stage(document.getElementById('c'), W, H);
const t0 = performance.now();
await st.loadWorld('/build/preview');
console.log('world built in', Math.round(performance.now() - t0), 'ms');
st.setTime(+(q.get('t') || 1000));
const p = (q.get('p') || '0,70,20').split(',').map(Number);
aimCamera(st.camera, p, +(q.get('yaw') || 180), +(q.get('pitch') || 10), +(q.get('fov') || 70));
st.render(); st.render();
window.READY = true;
</script></body></html>
