<!doctype html><html><head><meta charset="utf-8"><title>models</title>
<style>html,body{margin:0;background:#9aaab8}</style>
<script type="importmap">{"imports":{"three":"/web/node_modules/three/build/three.module.js"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { PlayerModel, loadSkinTexture } from './lib/player.js';
import { loadItemModel, itemMesh, itemDisplayMatrix, heldMatrix } from './lib/mcmodel.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1400), H = +(q.get('h') || 500);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setSize(W, H); renderer.outputColorSpace = THREE.LinearSRGBColorSpace; renderer.setClearColor(0x9aaab8);
const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const dl = new THREE.DirectionalLight(0xffffff, 1.7); dl.position.set(3, 6, 4); scene.add(dl);
const RP = '/resourcepack';
const name = q.get('model') || 'hermes';
const ty = +(q.get('ty') || 0), sc = +(q.get('scale') || 1);
const yaws = (q.get('yaws') || '90,0,-90,180,135').split(',').map(Number);
const rider = q.get('rider');
const seat = +(q.get('seat') || 0.63);
const entry = await loadItemModel(RP, name);
const spacing = +(q.get('sp') || 3.2);
yaws.forEach((yaw, i) => {
  const x = (i - (yaws.length - 1) / 2) * spacing;
  const h = itemMesh(entry);
  h.matrix.copy(itemDisplayMatrix([x, seat, 0], yaw, 0, { translation: [0, ty, 0], scale: [sc, sc, sc] }));
  scene.add(h);
  if (rider) {
    const [skin, kind] = rider.split(':');
    const p = new PlayerModel(loadSkinTexture(`${RP}/assets/kino/textures/entity/skins/${skin}.png`), kind === 'slim');
    p.applyPose({ pose: 'riding' });
    p.root.position.set(x, seat - 0.6, 0);
    p.root.rotation.y = -yaw * Math.PI / 180;
    scene.add(p.root);
  }
});
const holdSkin = q.get('hold');
if (holdSkin) {
  const items = (q.get('items') || name).split(',');
  for (let i = 0; i < items.length; i++) {
    const e = await loadItemModel(RP, items[i]);
    const [skin, kind] = holdSkin.split(':');
    for (let k = 0; k < 2; k++) {
      const p = new PlayerModel(loadSkinTexture(`${RP}/assets/kino/textures/entity/skins/${skin}.png`), kind === 'slim');
      p.applyPose({ holding: { right: true }, aim: k === 1 });
      p.root.position.set((i * 2 + k - items.length) * 1.3 + 0.6, 0, 3);
      p.root.rotation.y = -0.9;
      const hm = itemMesh(e); hm.matrix.copy(heldMatrix(e.json, false, kind === 'slim'));
      p.rightArm.add(hm);
      scene.add(p.root);
    }
  }
}
const grid = new THREE.GridHelper(40, 40, 0x556070, 0x7a8898); scene.add(grid);
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 30), W / H, 0.1, 200);
const cz = +(q.get('cz') || 12), cy = +(q.get('cy') || 4);
cam.position.set(0, cy, cz); cam.lookAt(0, +(q.get('ly') || 0.8), 0);
setTimeout(() => { renderer.render(scene, cam); window.READY = true; }, 1200);
</script></body></html>
